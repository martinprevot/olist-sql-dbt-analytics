name: dbt CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: olist
          POSTGRES_DB: olist
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U olist" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/download_data.py
      - run: python scripts/load_raw.py
      - name: dbt build (models + tests)
        run: cd olist_dbt && dbt build --profiles-dir .
